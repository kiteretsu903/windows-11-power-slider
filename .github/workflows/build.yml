name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage portable app
        run: cmake --install build --config Release --prefix dist/app

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PowerModeNative.iss'

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -LiteralPath dist/SHA256SUMS.txt
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PowerModeNative-windows-x64
          path: |
            dist/app/PowerModeNative.exe
            dist/PowerModeNative-Setup-*-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
